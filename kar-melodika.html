    <style>

            .white-key { width: 36px; height: 150px; font-size: 13px; }
            .black-key { width: 22px; height: 95px; }

<script>
    const { Renderer, Stave, StaveNote, Voice, Formatter, Annotation } = Vex.Flow;

    const notesRaw = [
        // System 1 (Ölçü 1-2)
        { key: "g/4", dur: "q", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },
        { key: "g/4", dur: "q", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },
        { key: "g/4", dur: "q", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },
        { key: "g/4", dur: "q", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },
        { key: "g/4", dur: "q", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },
        { key: "g/4", dur: "q", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },
        { key: "g/4", dur: "h", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },

        // System 2 (Ölçü 3-4)
        { key: "g/4", dur: "q", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },
        { key: "f/4", dur: "q", color: "#eab308", activeColor: "#ca8a04", name: "FA", noteName: "F4" },
        { key: "e/4", dur: "q", color: "#a855f7", activeColor: "#7e22ce", name: "Mİ", noteName: "E4" },
        { key: "d/4", dur: "q", color: "#22c55e", activeColor: "#15803d", name: "RE", noteName: "D4" },
        { key: "c/4", dur: "q", color: "#ef4444", activeColor: "#b91c1c", name: "DO", noteName: "C4" },
        { key: "e/4", dur: "q", color: "#a855f7", activeColor: "#7e22ce", name: "Mİ", noteName: "E4" },
        { key: "g/4", dur: "h", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },

        // System 3 (Ölçü 5-6)
        { key: "g/4", dur: "q", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },
        { key: "g/4", dur: "q", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },
        { key: "g/4", dur: "q", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },
        { key: "g/4", dur: "q", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },
        { key: "g/4", dur: "q", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },
        { key: "g/4", dur: "q", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },
        { key: "g/4", dur: "h", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },

        // System 4 (Ölçü 7-8)
        { key: "g/4", dur: "q", color: "#38bdf8", activeColor: "#0284c7", name: "SOL", noteName: "G4" },
        { key: "f/4", dur: "q", color: "#eab308", activeColor: "#ca8a04", name: "FA", noteName: "F4" },
        { key: "e/4", dur: "q", color: "#a855f7", activeColor: "#7e22ce", name: "Mİ", noteName: "E4" },
        { key: "d/4", dur: "q", color: "#22c55e", activeColor: "#15803d", name: "RE", noteName: "D4" },
        { key: "c/4", dur: "q", color: "#ef4444", activeColor: "#b91c1c", name: "DO", noteName: "C4" },
        { key: "c/4", dur: "q", color: "#ef4444", activeColor: "#b91c1c", name: "DO", noteName: "C4" },
        { key: "c/4", dur: "h", color: "#ef4444", activeColor: "#b91c1c", name: "DO", noteName: "C4" }
    ];

    let showNoteNames = true;
    let noteSVGNodes = [];

    function renderScore() {
        const container = document.getElementById('vf-paper');
        container.innerHTML = '';

        const renderer = new Renderer(container, Renderer.Backends.SVG);
        renderer.resize(840, 520);
        const context = renderer.getContext();

        // Responsive SVG ViewBox Ayarı
        const svgElem = container.querySelector('svg');
        if (svgElem) {
            svgElem.setAttribute("viewBox", "0 0 840 520");
            svgElem.setAttribute("preserveAspectRatio", "xMidYMid meet");
        }

        noteSVGNodes = [];

        const systemSpecs = [
            { y: 20, m1Notes: [0, 1, 2, 3], m2Notes: [4, 5, 6], showClefTime: true },
            { y: 140, m1Notes: [7, 8, 9, 10], m2Notes: [11, 12, 13], showClefTime: false, num: "3" },
            { y: 260, m1Notes: [14, 15, 16, 17], m2Notes: [18, 19, 20], showClefTime: false, num: "5" },
            { y: 380, m1Notes: [21, 22, 23, 24], m2Notes: [25, 26, 27], showClefTime: false, num: "7", endBar: true }
        ];

        systemSpecs.forEach((sys) => {
            const stave1Width = sys.showClefTime ? 450 : 400;
            const stave1 = new Stave(40, sys.y, stave1Width);
            if (sys.showClefTime) {
                stave1.addClef("treble").addTimeSignature("4/4");
            } else if (sys.num) {
                context.setFont("serif", 13, "italic");
                context.fillText(sys.num, 20, sys.y + 20);
            }
            stave1.setContext(context).draw();

            const stave2X = 40 + stave1Width;
            const stave2 = new Stave(stave2X, sys.y, 350);
            if (sys.endBar) {
                stave2.setEndBarType(Vex.Flow.Barline.type.END);
            }
            stave2.setContext(context).draw();

            const vfM1Notes = sys.m1Notes.map(idx => {
                const item = notesRaw[idx];
                const note = new StaveNote({
                    keys: [item.key],
                    duration: item.dur,
                    clef: "treble"
                });
                note.setStyle({ fillStyle: item.color, strokeStyle: item.color });
                if (showNoteNames) {
                    note.addModifier(new Annotation(item.name).setFont("Segoe UI", 11, "bold").setVerticalJustification(Annotation.VerticalJustify.TOP));
                }
                return note;
            });

            const vfM2Notes = sys.m2Notes.map(idx => {
                const item = notesRaw[idx];
                const note = new StaveNote({
                    keys: [item.key],
                    duration: item.dur,
                    clef: "treble"
                });
                note.setStyle({ fillStyle: item.color, strokeStyle: item.color });
                if (showNoteNames) {
                    note.addModifier(new Annotation(item.name).setFont("Segoe UI", 11, "bold").setVerticalJustification(Annotation.VerticalJustify.TOP));
                }
                return note;
            });

            const voice1 = new Voice({ num_beats: 4, beat_value: 4 }).addTickables(vfM1Notes);
            new Formatter().joinVoices([voice1]).format([voice1], stave1Width - (sys.showClefTime ? 120 : 60));
            voice1.draw(context, stave1);

            const voice2 = new Voice({ num_beats: 4, beat_value: 4 }).addTickables(vfM2Notes);
            new Formatter().joinVoices([voice2]).format([voice2], 260);
            voice2.draw(context, stave2);

            [...vfM1Notes, ...vfM2Notes].forEach((vfNote, localIdx) => {
                const globalIdx = (sys.m1Notes.concat(sys.m2Notes))[localIdx];
                const elem = vfNote.getSVGElement();
                if (elem) {
                    elem.setAttribute("id", `vf-note-${globalIdx}`);
                    elem.classList.add("vf-stavenote");
                    elem.onclick = () => playSingleNote(notesRaw[globalIdx].noteName, globalIdx);
                    noteSVGNodes[globalIdx] = elem;
                }
            });
        });
    }

    const fullWhiteKeys = [
        "F3", "G3", "A3", "B3", 
        "C4", "D4", "E4", "F4", "G4", "A4", "B4", 
        "C5", "D5", "E5", "F5", "G5", "A5", "B5", "C6"
    ];

    const fullBlackKeys = [
        { note: "F#3", pos: 0 }, { note: "G#3", pos: 1 }, { note: "A#3", pos: 2 },
        { note: "C#4", pos: 4 }, { note: "D#4", pos: 5 }, { note: "F#4", pos: 7 }, { note: "G#4", pos: 8 }, { note: "A#4", pos: 9 },
        { note: "C#5", pos: 11 }, { note: "D#5", pos: 12 }, { note: "F#5", pos: 14 }, { note: "G#5", pos: 15 }, { note: "A#5", pos: 16 }
    ];

    const keyboard = document.getElementById('keyboard');

    function buildKeyboard() {
        let html = '';
        const isMobile = window.innerWidth < 640;
        const keyW = isMobile ? 34 : 36;
        const keyOffset = isMobile ? 24 : 26;

        fullWhiteKeys.forEach(k => {
            const displayName = k.replace(/[0-9]/g, '');
            html += `<div class="white-key" id="key-${k}" 
                        onmousedown="handleKeyDown('${k}')" 
                        onmouseup="handleKeyUp('${k}')" 
                        onmouseleave="handleKeyUp('${k}')"
                        ontouchstart="handleKeyDown('${k}')"
                        ontouchend="handleKeyUp('${k}')">
                        <span style="margin-bottom: 20px; font-weight:bold; font-size:11px;">${k}</span>
                        <span>${displayName}</span>
                    </div>`;
        });
        keyboard.innerHTML = html;

        fullBlackKeys.forEach(bk => {
            const el = document.createElement('div');
            el.className = 'black-key';
            el.id = `key-${bk.note}`;
            const leftPos = bk.pos * keyW + keyOffset;
            el.style.left = `${leftPos}px`;
            el.onmousedown = () => handleKeyDown(bk.note);
            el.onmouseup = () => handleKeyUp(bk.note);
            el.onmouseleave = () => handleKeyUp(bk.note);
            el.ontouchstart = () => handleKeyDown(bk.note);
            el.ontouchend = () => handleKeyUp(bk.note);
            keyboard.appendChild(el);
        });
    }

    function autoScrollToKey(noteName) {
        const keyEl = document.getElementById(`key-${noteName}`);
        const wrapper = document.getElementById('scrollWrapper');
        if (keyEl && wrapper) {
            const keyLeft = keyEl.offsetLeft;
            const wrapperWidth = wrapper.clientWidth;
            wrapper.scrollTo({
                left: keyLeft - (wrapperWidth / 2) + 15,
                behavior: 'smooth'
            });
        }
    }

    const freqMap = {
        "F3": 174.61, "F#3": 185.00, "G3": 196.00, "G#3": 207.65, "A3": 220.00, "A#3": 233.08, "B3": 246.94,
        "C4": 261.63, "C#4": 277.18, "D4": 293.66, "D#4": 311.13, "E4": 329.63, "F4": 349.23, "F#4": 369.99,
        "G4": 392.00, "G#4": 415.30, "A4": 440.00, "A#4": 466.16, "B4": 493.88, "C5": 523.25, "C#5": 554.37,
        "D5": 587.33, "D#5": 622.25, "E5": 659.25, "F5": 698.46, "F#5": 739.99, "G5": 783.99, "G#5": 830.61,
        "A5": 880.00, "A#5": 932.33, "B5": 987.77, "C6": 1046.50
    };

    let audioCtx = null;
    let activeNodes = {};

    function getAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    window.addEventListener('pointerdown', () => getAudioContext(), { once: true });

    function startNoteAudio(noteName) {
        stopNoteAudio(noteName);

        const ctx = getAudioContext();
        const freq = freqMap[noteName];
        if (!freq) return;

        autoScrollToKey(noteName);

        const startTime = ctx.currentTime;
        const masterGain = ctx.createGain();

        const harmonics = [
            { f: 1.0,  amp: 0.8 },
            { f: 2.0,  amp: 0.45 },
            { f: 3.0,  amp: 0.3 },
            { f: 4.0,  amp: 0.18 },
            { f: 5.0,  amp: 0.12 }
        ];

        const oscillators = [];

        harmonics.forEach(h => {
            const osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq * h.f, startTime);

            const hGain = ctx.createGain();
            hGain.gain.setValueAtTime(h.amp, startTime);

            osc.connect(hGain);
            hGain.connect(masterGain);

            osc.start(startTime);
            oscillators.push(osc);
        });

        const bodyResonator = ctx.createBiquadFilter();
        bodyResonator.type = 'lowpass';
        bodyResonator.frequency.setValueAtTime(1350, startTime);
        bodyResonator.Q.setValueAtTime(1.1, startTime);

        masterGain.gain.setValueAtTime(0.001, startTime);
        masterGain.gain.linearRampToValueAtTime(0.35, startTime + 0.015);

        masterGain.connect(bodyResonator);
        bodyResonator.connect(ctx.destination);

        activeNodes[noteName] = {
            oscillators: oscillators,
            masterGain: masterGain,
            ctx: ctx
        };
    }

    function stopNoteAudio(noteName) {
        if (activeNodes[noteName]) {
            const { oscillators, masterGain, ctx } = activeNodes[noteName];
            const stopTime = ctx.currentTime + 0.06;

            masterGain.gain.setValueAtTime(masterGain.gain.value, ctx.currentTime);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, stopTime);

            oscillators.forEach(osc => {
                osc.stop(stopTime);
            });

            delete activeNodes[noteName];
        }
    }

    function playNoteAudioFixed(noteName, duration = 0.5) {
        startNoteAudio(noteName);
        highlightKeyInstant(noteName, duration * 1000);
        setTimeout(() => {
            stopNoteAudio(noteName);
        }, duration * 1000);
    }

    let activeKeyTimers = {};

    function highlightKeyInstant(noteName, durationMs, customClass = 'active') {
        const keyEl = document.getElementById(`key-${noteName}`);
        if (keyEl) {
            keyEl.classList.add(customClass);
            if (activeKeyTimers[noteName]) clearTimeout(activeKeyTimers[noteName]);
            activeKeyTimers[noteName] = setTimeout(() => {
                keyEl.classList.remove(customClass);
            }, durationMs);
        }
    }

    function highlightScoreNote(index) {
        notesRaw.forEach((item, i) => {
            const elem = document.getElementById(`vf-note-${i}`);
            if (elem) {
                elem.classList.remove('active-note');
                const paths = elem.querySelectorAll('path');
                paths.forEach(p => {
                    p.setAttribute('fill', item.color);
                    p.setAttribute('stroke', item.color);
                });
            }
        });

        if (index >= 0 && index < notesRaw.length) {
            const elem = document.getElementById(`vf-note-${index}`);
            const item = notesRaw[index];
            if (elem) {
                elem.classList.add('active-note');
                const paths = elem.querySelectorAll('path');
                paths.forEach(p => {
                    p.setAttribute('fill', item.activeColor);
                    p.setAttribute('stroke', item.activeColor);
                });
            }
        }
    }

    function handleKeyDown(pressedNote) {
        startNoteAudio(pressedNote);
        const keyEl = document.getElementById(`key-${pressedNote}`);

        if (!isPlaying && currentStep < notesRaw.length) {
            const expectedNote = notesRaw[currentStep].noteName;
            const badge = document.getElementById('feedbackBadge');

            if (pressedNote === expectedNote) {
                if (keyEl) keyEl.classList.add('correct-key');
                badge.textContent = `👏 Harika! Doğru Nota: ${notesRaw[currentStep].name}`;
                badge.className = 'feedback-badge correct';
                
                highlightScoreNote(currentStep);
                currentStep++;
                if (currentStep < notesRaw.length) {
                    setTimeout(() => highlightScoreNote(currentStep), 350);
                } else {
                    badge.textContent = `🎉 Tebrikler! Şarkıyı Başarıyla Tamamladın!`;
                }
            } else {
                if (keyEl) keyEl.classList.add('wrong-key');
                badge.textContent = `❌ Tekrar Dene! Bastığın: ${pressedNote.replace(/[0-9]/g,'')} - Beklenen: ${notesRaw[currentStep].name}`;
                badge.className = 'feedback-badge wrong';
            }
        } else if (keyEl) {
            keyEl.classList.add('active');
        }
    }

    function handleKeyUp(pressedNote) {
        stopNoteAudio(pressedNote);
        const keyEl = document.getElementById(`key-${pressedNote}`);
        if (keyEl) {
            keyEl.classList.remove('active', 'correct-key', 'wrong-key');
        }
    }

    let isPlaying = false;
    let currentStep = 0;
    let timerId = null;

    function updatePlayButtonsUI(playing) {
        const pBtn = document.getElementById('playBtn');
        const sBtn = document.getElementById('sidePlayBtn');
        if (playing) {
            pBtn.textContent = '⏸ Duraklat';
            sBtn.textContent = '⏸';
        } else {
            pBtn.textContent = '▶ Oynat';
            sBtn.textContent = '▶';
        }
    }

    function playStep() {
        if (!isPlaying) return;

        if (currentStep >= notesRaw.length) {
            stopPlayback();
            return;
        }

        const noteInfo = notesRaw[currentStep];
        const bpm = parseInt(document.getElementById('bpm').value);
        const beatDuration = 60 / bpm;
        const durationMultiplier = noteInfo.dur === 'h' ? 2 : 1;
        const noteDuration = beatDuration * durationMultiplier;

        highlightScoreNote(currentStep);
        playNoteAudioFixed(noteInfo.noteName, noteDuration * 0.9);

        currentStep++;
        timerId = setTimeout(playStep, noteDuration * 1000);
    }

    function togglePlayback() {
        if (isPlaying) {
            isPlaying = false;
            clearTimeout(timerId);
            updatePlayButtonsUI(false);
        } else {
            isPlaying = true;
            updatePlayButtonsUI(true);
            document.getElementById('feedbackBadge').className = 'feedback-badge';
            playStep();
        }
    }

    function stopPlayback() {
        isPlaying = false;
        clearTimeout(timerId);
        currentStep = 0;
        highlightScoreNote(-1);
        updatePlayButtonsUI(false);
        document.getElementById('feedbackBadge').className = 'feedback-badge';
        autoScrollToKey("C4");
    }

    function playSingleNote(noteName, index) {
        highlightScoreNote(index);
        playNoteAudioFixed(noteName, 0.6);
        setTimeout(() => highlightScoreNote(-1), 600);
    }

    document.getElementById('playBtn').onclick = togglePlayback;
    document.getElementById('sidePlayBtn').onclick = togglePlayback;
    document.getElementById('stopBtn').onclick = stopPlayback;

    document.getElementById('slowBtn').onclick = () => {
        document.getElementById('bpm').value = 60;
        document.getElementById('bpmVal').textContent = "60 BPM (Yavaş)";
    };

    document.getElementById('normalBtn').onclick = () => {
        document.getElementById('bpm').value = 85;
        document.getElementById('bpmVal').textContent = "85 BPM (Normal)";
    };

    document.getElementById('bpm').oninput = (e) => {
        document.getElementById('bpmVal').textContent = e.target.value + " BPM";
    };

    document.getElementById('toggleNamesBtn').onclick = () => {
        showNoteNames = !showNoteNames;
        const btn = document.getElementById('toggleNamesBtn');
        btn.textContent = showNoteNames ? "🏷️ Notalar: Açık" : "🙈 Notalar: Gizli";
        renderScore();
    };

    window.onload = () => {
        renderScore();
        buildKeyboard();
        setTimeout(() => autoScrollToKey("C4"), 200);
    };

    window.onresize = () => {
        renderScore();
        buildKeyboard();
    };
</script>
