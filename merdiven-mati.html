<script>
const PIECES = { 'K': '♔', 'Q': '♕', 'R': '♖', 'k': '♚' };

const levels = [
  { id: 1, title: "1. Tek Hamlede Son Sıra Matı", desc: "Siyah Şah g8'de. Vezirinle g7 veya h8 karesine gelerek MAT yap!", fen: "6k1/8/6K1/8/8/8/7Q/8 w - - 0 1" },
  { id: 2, title: "2. Çift Kale ile 1 Hamlede Mat", desc: "b7'deki kale 7. sırayı tutuyor. h1'deki kaleyi h8 karesine sürerek mat et!", fen: "6k1/1R6/6K1/8/8/8/8/7R w - - 0 1" },
  { id: 3, title: "3. Vezir ve Kale ile Merdiven", desc: "Kale 6. sırayı kapattı. Önce Vezirinle 7. sıraya geçip şah çek, ardından Kale ile 8. sırada mat yap!", fen: "8/5k2/2R5/8/8/6K1/7Q/8 w - - 0 1" },
  { id: 4, title: "4. Çift Kale Adım Adım Merdiven", desc: "c5'teki kale 5. sırayı tutuyor. h2'deki kale ile 6. sıradan şah çekerek merdiveni tırman!", fen: "8/4k3/8/2R5/8/6K1/7R/8 w - - 0 1" },
  { id: 5, title: "5. Şahı Çizgiye Sıkıştırma", desc: "Kalelerini basamak yapıp siyah şahı 8. sıraya kadar sür ve mat et!", fen: "8/8/4k3/8/3R4/6K1/7R/8 w - - 0 1" },
  { id: 6, title: "6. Kritik Kural: Uzak Kanada Kaçış!", desc: "Siyah Şah kalene saldırdığında kaleni uzağa kaçırıp merdivene devam et!", fen: "8/3k4/3R4/8/8/6K1/7R/8 w - - 0 1" },
  { id: 7, title: "7. Dikey (Yan Kanat) Merdiven Matı", desc: "Şahı dikey sütunlar boyunca h-sütununa sıkıştırarak mat et!", fen: "8/8/8/4k3/4R3/6K1/4R3/8 w - - 0 1" },
  { id: 8, title: "8. Çapraz Başlangıçtan Kurulum", desc: "Kalelerin henüz hizalanmadı. Önce bekçi kalesini uygun sıraya yerleştir!", fen: "8/8/3k4/8/8/6K1/1R5R/8 w - - 0 1" },
  { id: 9, title: "9. İnatçı Şaha Karşı Vezir-Kale", desc: "Vezir ve Kaleni koruyarak merdiveni adım adım tamamla.", fen: "8/8/8/2k5/8/6K1/1R5Q/8 w - - 0 1" },
  { id: 10, title: "10. Usta Düzeyi Şampiyonluk", desc: "Sıfırdan mükemmel bir Merdiven Matı sergile!", fen: "8/8/8/3k4/8/6K1/R6R/8 w - - 0 1" }
];

let currentLevelIdx = 0, boardState = Array(8).fill(null).map(() => Array(8).fill(null)), history = [], selectedSquare = null, validMoves = [], turn = 'w';

function squareToCoord(r, c) { return String.fromCharCode(97 + c) + (8 - r); }

function initUI() {
  const selectContainer = document.getElementById('levelSelect');
  selectContainer.innerHTML = '';
  levels.forEach((lvl, idx) => {
    const btn = document.createElement('div');
    btn.className = `level-btn ${idx === currentLevelIdx ? 'active' : ''}`;
    btn.innerText = lvl.id;
    btn.onclick = () => loadLevel(idx);
    selectContainer.appendChild(btn);
  });
}

function loadLevel(idx) {
  currentLevelIdx = idx; initUI();
  const lvl = levels[idx];
  document.getElementById('levelTitle').innerText = lvl.title;
  document.getElementById('levelDesc').innerText = lvl.desc;
  setFeedback("İstediğin geçerli hamleyi serbestçe yapabilirsin. Başarılar!", "info");
  parseFEN(lvl.fen);
  history = []; selectedSquare = null; validMoves = []; turn = 'w';
  clearArrow(); renderBoard();
}

function parseFEN(fen) {
  boardState = Array(8).fill(null).map(() => Array(8).fill(null));
  const rows = fen.split(' ')[0].split('/');
  for (let r = 0; r < 8; r++) {
    let c = 0;
    for (let char of rows[r]) {
      if (!isNaN(char)) c += parseInt(char);
      else { boardState[r][c] = char; c++; }
    }
  }
}

function undoMove() {
  if (history.length === 0) return setFeedback("Geri alınacak hamle yok.", "error");
  const last = history.pop();
  boardState = last.board; turn = last.turn;
  selectedSquare = null; validMoves = []; clearArrow(); renderBoard();
  setFeedback("Hamle geri alındı.", "info");
}

function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const sq = document.createElement('div');
      sq.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
      if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) sq.classList.add('selected');
      
      const piece = boardState[r][c];
      if (piece) {
        const pieceEl = document.createElement('div');
        pieceEl.className = `piece ${piece === piece.toUpperCase() ? 'white' : 'black'}`;
        pieceEl.innerText = PIECES[piece];
        sq.appendChild(pieceEl);
      }

      if (validMoves.some(m => m.r === r && m.c === c)) {
        const dot = document.createElement('div');
        dot.className = 'move-dot';
        sq.appendChild(dot);
      }
      sq.onclick = () => handleSquareClick(r, c);
      boardEl.appendChild(sq);
    }
  }
}

function handleSquareClick(r, c) {
  if (turn !== 'w') return;
  const piece = boardState[r][c];

  if (selectedSquare) {
    if (selectedSquare.r === r && selectedSquare.c === c) { selectedSquare = null; validMoves = []; renderBoard(); return; }
    if (validMoves.some(m => m.r === r && m.c === c)) { makePlayerMove(selectedSquare, { r, c }); return; }
  }

  if (piece && piece === piece.toUpperCase()) {
    selectedSquare = { r, c };
    validMoves = getPseudoMoves(r, c, boardState);
    renderBoard();
  } else { selectedSquare = null; validMoves = []; renderBoard(); }
}

function getPseudoMoves(r, c, board) {
  const piece = board[r][c]; if (!piece) return [];
  const type = piece.toLowerCase(), isWhite = piece === piece.toUpperCase();
  let moves = [];
  const addLine = (dr, dc) => {
    let nr = r + dr, nc = c + dc;
    while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
      if (!board[nr][nc]) moves.push({ r: nr, c: nc });
      else { if ((board[nr][nc] === board[nr][nc].toUpperCase()) !== isWhite) moves.push({ r: nr, c: nc }); break; }
      nr += dr; nc += dc;
    }
  };
  if (type === 'r' || type === 'q') { addLine(1,0); addLine(-1,0); addLine(0,1); addLine(0,-1); }
  if (type === 'q') { addLine(1,1); addLine(1,-1); addLine(-1,1); addLine(-1,-1); }
  if (type === 'k') {
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) {
      if(dr===0&&dc===0) continue;
      let nr=r+dr, nc=c+dc;
      if(nr>=0&&nr<8&&nc>=0&&nc<8) {
        if(!board[nr][nc] || (board[nr][nc] === board[nr][nc].toUpperCase()) !== isWhite) moves.push({r: nr, c: nc});
      }
    }
  }
  return moves;
}

function isSquareAttacked(r, c, attackerColor, board) {
  for (let br = 0; br < 8; br++) {
    for (let bc = 0; bc < 8; bc++) {
      const p = board[br][bc];
      if (!p) continue;
      const isAttackerWhite = (p === p.toUpperCase());
      if ((attackerColor === 'w' && isAttackerWhite) || (attackerColor === 'b' && !isAttackerWhite)) {
        const moves = getPseudoMoves(br, bc, board);
        if (moves.some(m => m.r === r && m.c === c)) return true;
      }
    }
  }
  return false;
}

function getKingLegalMoves(board) {
  let kPos = null;
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (board[r][c] === 'k') kPos = { r, c };
  if (!kPos) return [];

  let pMoves = getPseudoMoves(kPos.r, kPos.c, board);
  let legal = [];
  for (let m of pMoves) {
    let tmp = JSON.parse(JSON.stringify(board));
    tmp[m.r][m.c] = 'k'; tmp[kPos.r][kPos.c] = null;
    if (!isSquareAttacked(m.r, m.c, 'w', tmp)) {
      legal.push(m);
    }
  }
  return legal;
}

function makePlayerMove(from, to) {
  let backup = JSON.parse(JSON.stringify(boardState));
  history.push({ board: backup, turn });

  boardState[to.r][to.c] = boardState[from.r][from.c]; 
  boardState[from.r][from.c] = null;
  selectedSquare = null; validMoves = []; clearArrow(); renderBoard();

  let kingMoves = getKingLegalMoves(boardState);
  let kPos = null;
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (boardState[r][c] === 'k') kPos = { r, c };
  let isCheck = isSquareAttacked(kPos.r, kPos.c, 'w', boardState);

  // 1. TAM MAT KONTROLÜ
  if (isCheck && kingMoves.length === 0) {
    setFeedback("🏆 TEBRİKLER! MÜKEMMEL BİR MERDİVEN MATI! Rakip şah tamamen çaresiz kaldı.", "success");
    document.querySelectorAll('.level-btn')[currentLevelIdx].classList.add('completed');
    turn = 'done';
    return;
  }

  // 2. PAT KONTROLÜ
  if (!isCheck && kingMoves.length === 0) {
    history.pop(); boardState = backup; renderBoard();
    setFeedback("⚠️ Pat Oldu! Siyah şahın hamlesi kalmadı ama şah altında değil. Taşın geri dönüyor.", "error");
    return;
  }

  // 3. NORMAL HAMLE / ŞAH ÇEKME (Serbest Akış - Taş geri dönmez!)
  if (isCheck) {
    let escapeCoord = squareToCoord(kingMoves[0].r, kingMoves[0].c);
    setFeedback(`⚔️ Şah Çektin! Siyah şah ${escapeCoord.toUpperCase()} karesine kaçıyor... Merdiven matını tamamla!`, "success");
  } else {
    setFeedback(`👏 Güzel hamle (${squareToCoord(to.r, to.c).toUpperCase()})! Bilgisayar hamlesini yapıyor...`, "success");
  }

  turn = 'b';
  setTimeout(makeComputerMove, 600);
}

function makeComputerMove() {
  let kPos = null;
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (boardState[r][c] === 'k') kPos = { r, c };
  let moves = getKingLegalMoves(boardState);

  if (moves.length > 0) {
    let best = moves[Math.floor(Math.random() * moves.length)];
    boardState[best.r][best.c] = 'k'; boardState[kPos.r][kPos.c] = null;
  }
  turn = 'w'; renderBoard();
}

function showHint() {
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (boardState[r][c] && boardState[r][c] === boardState[r][c].toUpperCase()) {
        let pm = getPseudoMoves(r, c, boardState);
        for (let m of pm) {
          let tmp = JSON.parse(JSON.stringify(boardState));
          tmp[m.r][m.c] = tmp[r][c]; tmp[r][c] = null;
          let kMoves = getKingLegalMoves(tmp);
          let kPos = null;
          for (let kr = 0; kr < 8; kr++) for (let kc = 0; kc < 8; kc++) if (tmp[kr][kc] === 'k') kPos = { kr, kc };
          
          if (isSquareAttacked(kPos.kr, kPos.kc, 'w', tmp) && kMoves.length === 0) {
            drawArrow(r, c, m.r, m.c);
            setFeedback(`💡 İpucu: Taşını ${squareToCoord(r,c).toUpperCase()} -> ${squareToCoord(m.r, m.c).toUpperCase()} karesine sürersen TEK HAMLEDE MAT olur!`, "info");
            return;
          }
        }
      }
    }
  }
  setFeedback("💡 Şahın kaçış yolunu kapatacak basamak kalesini doğru sıraya sür!", "info");
}

function drawArrow(fR, fC, tR, tC) {
  const svg = document.getElementById('svgOverlay');
  svg.innerHTML = `<line x1="${fC*60+30}" y1="${fR*60+30}" x2="${tC*60+30}" y2="${tR*60+30}" stroke="#e67e22" stroke-width="6" opacity="0.8"/>`;
}
function clearArrow() { document.getElementById('svgOverlay').innerHTML = ''; }
function setFeedback(msg, type) { const box = document.getElementById('feedbackBox'); box.innerText = msg; box.className = `feedback-box ${type}`; }
function resetLevel() { loadLevel(currentLevelIdx); }
window.onload = () => loadLevel(0);
</script>
